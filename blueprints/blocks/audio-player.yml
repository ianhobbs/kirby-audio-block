name: Audio player
icon: file-audio
tabs:
  main:
    label: Main
    fields:
      poster:
        type: files
        query: page.images.template('poster')
        uploads: poster
        multiple: false
        width: 1/2
      source:
        type: files
        query: page.audio.template('audio')
        uploads: audio
        multiple: false
        width: 1/2
      title:
        type: text
        placeholder: Title
      subtitle:
        type: text
        placeholder: Subtitle
      description:
        type: writer
        icon: text
        inline: true
        placeholder: Description
        marks:
          - bold
          - italic
      bgcolor:
        type: color
        label: Background color
        help: Leave empty to use the site's default (--ap-color-bg token).
      textcolor:
        type: color
        label: Text color
        help: Leave empty to use the site's default (--ap-color-text token).
      stuff:
        type: info
        text: |
          This is a custom audio block. It will display audio on the front end.

  settings:
    label: Settings
    fields:
      controls:
        type: toggle
        text: Show controls?
        width: 1/2
        default: true
      autoplay:
        type: toggle
        text: Autoplay
        width: 1/2
        default: false
        help: Most browsers block audio autoplay until the visitor has interacted with the page.
